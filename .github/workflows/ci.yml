name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    name: mobile (test, typecheck, map bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      # src/components/map-bundle.ts is a generated, committed file
      # (scripts/build-map.cjs is deterministic — verified locally). This
      # catches a PR that changed the map source without regenerating it.
      - name: Verify generated map bundle is up to date
        run: |
          npm run build:map
          git diff --exit-code -- src/components/map-bundle.ts
