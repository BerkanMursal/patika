#
# GDAL OSM driver config for Patika park extraction.
#
# Copy of /usr/share/gdal/osmconf.ini with two additions, both scoped to the
# [points] and [multipolygons] layers used by scripts/build-nationwide-pbf-baseline.mjs:
#   - "leisure" reported on points too (multipolygons already reports it by default)
#   - addr:city/addr:district/addr:suburb/addr:neighbourhood/addr:street,
#     name:tr, official_name, loc_name, wikidata reported on both layers,
#     matching the tag set scripts/park-enrichment.mjs and
#     scripts/build-catalog.mjs already read from the Overpass JSON.
# Everything else is unchanged from the GDAL default.

closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,highway=platform,public_transport=platform

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,barrier,highway,ref,address,is_in,place,man_made,leisure,addr:city,addr:district,addr:suburb,addr:neighbourhood,addr:street,name:tr,official_name,loc_name,wikidata
unsignificant=created_by,converted_by,source,time,ele,attribution
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,highway,waterway,aerialway,barrier,man_made,leisure
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
computed_attributes=z_order
z_order_type=Integer
z_order_sql="SELECT (CASE [highway] WHEN 'minor' THEN 3 WHEN 'road' THEN 3 WHEN 'unclassified' THEN 3 WHEN 'residential' THEN 3 WHEN 'tertiary_link' THEN 4 WHEN 'tertiary' THEN 4 WHEN 'secondary_link' THEN 6 WHEN 'secondary' THEN 6 WHEN 'primary_link' THEN 7 WHEN 'primary' THEN 7 WHEN 'trunk_link' THEN 8 WHEN 'trunk' THEN 8 WHEN 'motorway_link' THEN 9 WHEN 'motorway' THEN 9 ELSE 0 END) + (CASE WHEN [bridge] IN ('yes', 'true', '1') THEN 10 ELSE 0 END) + (CASE WHEN [tunnel] IN ('yes', 'true', '1') THEN -10 ELSE 0 END) + (CASE WHEN [railway] IS NOT NULL THEN 5 ELSE 0 END) + (CASE WHEN [layer] IS NOT NULL THEN 10 * CAST([layer] AS INTEGER) ELSE 0 END)"

[multipolygons]
# osm_id=yes instantiates osm_id for relation ids and osm_way_id for closed-way
# ids; exactly one of the two is set per feature — this is how we recover
# node/way/relation entity type after extraction.
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type,aeroway,amenity,admin_level,barrier,boundary,building,craft,geological,historic,land_area,landuse,leisure,man_made,military,natural,office,place,shop,sport,tourism,addr:city,addr:district,addr:suburb,addr:neighbourhood,addr:street,name:tr,official_name,loc_name,wikidata
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[multilinestrings]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type,leisure
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type,leisure
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
